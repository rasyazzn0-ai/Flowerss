<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flower For You</title>

<style>

body{
    margin:0;
    padding:0;
    width:100%;
    height:100vh;
    background:black;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:sans-serif;
    position:relative;
}

/* tulisan */

.nama{
    position:absolute;
    top:35%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:55px;
    letter-spacing:5px;
    white-space:nowrap;
}

.nama span{
    color:white;
    animation:kedip 1.2s infinite;
}

/* efek tulisan */

.nama span:nth-child(1){ animation-delay:0s; }
.nama span:nth-child(2){ animation-delay:0.2s; }
.nama span:nth-child(3){ animation-delay:0.4s; }
.nama span:nth-child(4){ animation-delay:0.6s; }
.nama span:nth-child(5){ animation-delay:0.8s; }
.nama span:nth-child(6){ animation-delay:1s; }
.nama span:nth-child(7){ animation-delay:1.2s; }
.nama span:nth-child(8){ animation-delay:1.4s; }
.nama span:nth-child(9){ animation-delay:1.6s; }
.nama span:nth-child(10){ animation-delay:1.8s; }
.nama span:nth-child(11){ animation-delay:2s; }
.nama span:nth-child(12){ animation-delay:2.2s; }
.nama span:nth-child(13){ animation-delay:2.4s; }

@keyframes kedip{

    0%{
        opacity:1;
        text-shadow:
        0 0 10px rgb(255, 0, 217),
        0 0 20px rgb(255, 0, 217),
        0 0 40px rgb(255, 0, 217);
    }

    50%{
        opacity:0.3;
        text-shadow:none;
    }

    100%{
        opacity:1;
        text-shadow:
        0 0 10px rgb(255, 0, 217),
        0 0 20px rgb(255, 0, 217),
        0 0 40px rgb(255, 0, 217);
    }

}

/* tombol umum */

button{
    padding:15px 40px;
    border:none;
    border-radius:50px;
    font-size:20px;
    cursor:pointer;
    transition:0.2s;
}

/* tombol yes */

.yes{
    position:absolute;
    top:58%;
    left:40%;
    transform:translateX(-50%);
    background:rgb(217, 0, 255);
    color:white;

    box-shadow:
    0 0 15px rgb(255, 255, 255),
    0 0 35px rgb(255, 255, 255);
}

/* tombol no */

.no{
    position:absolute;
    top:58%;
    left:60%;
    transform:translateX(-50%);
    background:white;
    color:black;
}

</style>
</head>

<body>

<h1 class="nama">
    <span>F</span>
    <span>L</span>
    <span>O</span>
    <span>W</span>
    <span>E</span>
    <span>R</span>

    <span>&nbsp;</span>

    <span>F</span>
    <span>O</span>
    <span>R</span>

    <span>&nbsp;</span>

    <span>Y</span>
    <span>O</span>
    <span>U?</span>
</h1>

<button class="yes"
onclick="window.location.href='Flower.html'">
YES
</button>

<button class="no" id="noBtn">
NO
</button>

<script>

const noBtn = document.getElementById("noBtn");

/* tombol no kabur */

noBtn.addEventListener("mouseover", () => {

    const x = Math.random() * (window.innerWidth - 120);

    const y = Math.random() * (window.innerHeight - 60);

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
});

</script>

</body>
</html>
